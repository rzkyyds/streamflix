name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Create local.properties
        run: |
          echo "APP_LAYOUT=mobile" >> local.properties
          echo "TMDB_API_KEY=noop" >> local.properties
          echo "SUBDL_API_KEY=noop" >> local.properties
          echo "RABBITSTREAM_SOURCE_API=noop" >> local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-idlix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
